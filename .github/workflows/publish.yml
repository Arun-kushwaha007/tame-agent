name: Publish to npm

on:
  workflow_dispatch: # Enables one-click manual trigger from the GitHub Actions tab
  release:
    types: [published] # Automatically triggers when you publish a new release on GitHub

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --access public --provenance
